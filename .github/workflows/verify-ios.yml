name: Verify Melody Music iOS

on:
  push:
    branches:
      - feat/ios-app-1.0
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run iOS web and account tests
        run: |
          node --test test/ios-config.test.mjs
          node --test test/ios-bridge.test.mjs
          node --test test/ios-playback-adapter.test.mjs
          node --test test/ios-mobile-ui.test.mjs
          node --test test/ios-release.test.mjs
          node --test test/user-account-delete.test.mjs
          node --test test/ios-native-diagnostics.test.mjs
          node --test test/ios-branding.test.mjs
          node --test test/ios-launch-splash.test.mjs
          node --test test/app-store-pages.test.mjs

      - name: Install iOS dependencies
        working-directory: ios-app
        run: npm install

      - name: Verify native audio Swift package for iOS Simulator
        working-directory: ios-app/native-audio
        run: |
          xcodebuild \
            -scheme MelodyNativeAudio \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build

      - name: Generate Capacitor iOS project
        working-directory: ios-app
        run: npx cap add ios

      - name: Sync Capacitor iOS project
        working-directory: ios-app
        run: npx cap sync ios

      - name: Configure background audio and branding
        working-directory: ios-app
        run: bash scripts/configure-ios.sh

      - name: Verify generated iOS project
        working-directory: ios-app
        run: |
          test -d ios/App
          test -d ios/App/App.xcodeproj
          test -f ios/App/App/Info.plist
          test -d ios/App/App/Assets.xcassets/AppIcon.appiconset
          test -d ios/App/App/Assets.xcassets/Splash.imageset
          find ios/App/App/Assets.xcassets/AppIcon.appiconset -type f -name '*.png' | grep -q .
          find ios/App/App/Assets.xcassets/Splash.imageset -type f -name '*.png' | grep -q .
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" ios/App/App/Info.plist | grep -qx audio
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
          echo "Capacitor iOS app builds with native audio, background audio, AppIcon, and Splash artwork"
