<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Melody Music</title>
  <meta name="theme-color" content="#101318" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Melody" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/amplitudejs@5.3.2/dist/amplitude.js"></script>
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <div>
        <div class="brand-kicker">MELODY MUSIC</div>
        <h1>音乐播放器</h1>
      </div>
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="搜索歌曲或歌手" aria-label="搜索歌曲或歌手" />
      </label>
    </header>

    <section class="music-layout" aria-label="音乐内容">
      <section class="panel song-panel">
        <div class="panel-heading">
          <div>
            <h2>歌曲列表</h2>
            <p>Melody Music</p>
          </div>
          <span id="songCount" class="count-chip">0 首</span>
        </div>
        <div id="songList" class="song-list">
          <div class="state-card">正在加载音乐…</div>
        </div>
      </section>

      <section class="panel now-panel">
        <div class="cover-stage">
          <img id="nowCover" class="now-cover" alt="当前歌曲封面" hidden />
          <div id="nowCoverFallback" class="cover-fallback" aria-hidden="true">♫</div>
        </div>

        <div class="now-copy">
          <h2 id="nowTitle">选择一首歌曲</h2>
          <p id="nowArtist">Melody Music</p>
        </div>

        <div id="lyrics" class="lyrics" aria-live="polite">
          <p class="muted">选择歌曲后显示同步歌词</p>
        </div>
      </section>
    </section>

    <section class="player-bar" aria-label="音乐播放器控制">
      <div class="player-song">
        <div class="mini-cover-wrap">
          <img id="playerCover" class="mini-cover" alt="当前歌曲封面" hidden />
          <div id="playerCoverFallback" class="mini-cover fallback">♪</div>
        </div>
        <div class="player-copy">
          <strong id="playerTitle">选择一首歌曲</strong>
          <span id="playerArtist">Melody Music</span>
        </div>
      </div>

      <div class="player-center">
        <div class="controls">
          <button class="round-btn amplitude-shuffle" type="button" aria-label="随机播放">↝</button>
          <button class="round-btn amplitude-prev" type="button" aria-label="上一首">◀|</button>
          <button class="play-btn amplitude-play-pause" type="button" aria-label="播放或暂停">
            <span class="play-icon">▶</span><span class="pause-icon">Ⅱ</span>
          </button>
          <button class="round-btn amplitude-next" type="button" aria-label="下一首">|▶</button>
          <button class="round-btn amplitude-repeat" type="button" aria-label="循环播放">↻</button>
        </div>

        <div class="progress-row">
          <span><span class="amplitude-current-minutes">0</span>:<span class="amplitude-current-seconds">00</span></span>
          <input class="amplitude-song-slider" type="range" step="0.1" aria-label="播放进度" />
          <span><span class="amplitude-duration-minutes">0</span>:<span class="amplitude-duration-seconds">00</span></span>
        </div>
      </div>

      <div class="volume-row">
        <button class="volume-btn amplitude-mute" type="button" aria-label="静音">🔊</button>
        <input class="amplitude-volume-slider" type="range" aria-label="音量" />
      </div>

      <div id="playbackStatus" class="status-text" aria-live="polite"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch((error) => {
          console.warn('Service Worker registration failed:', error);
        });
      });
    }
  </script>
</body>
</html>
