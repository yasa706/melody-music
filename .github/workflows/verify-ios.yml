name: Verify Melody Music iOS

on:
  push:
    branches:
      - feat/ios-app-1.0
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run web and configuration tests
        run: npm test

      - name: Install iOS dependencies
        working-directory: ios-app
        run: npm install

      - name: Verify native audio Swift package
        working-directory: ios-app
        run: swift test --package-path native-audio

      - name: Generate Capacitor iOS project
        working-directory: ios-app
        run: npx cap add ios

      - name: Sync Capacitor iOS project
        working-directory: ios-app
        run: npx cap sync ios

      - name: Verify generated iOS project
        working-directory: ios-app
        run: |
          test -d ios/App
          test -f ios/App/App/Info.plist
          echo "Capacitor iOS project generated successfully"
