<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Melody 后台</title><link rel="stylesheet" href="/admin/admin.css"></head><body>
<div id="app"></div>
<template id="loginTpl"><main class="login-wrap"><form id="loginForm" class="panel login-card"><h1>♪ Melody 后台</h1><p class="muted">管理员登录</p><label>账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button><p id="loginError" class="error"></p></form></main></template>
<template id="adminTpl"><div class="layout"><aside><div class="brand">♪ Melody</div><button data-tab="dashboard" class="nav active">仪表盘</button><button data-tab="songs" class="nav">歌曲</button><button data-tab="albums" class="nav">专辑</button><button data-tab="playlists" class="nav">歌单</button><button data-tab="categories" class="nav">分类</button><a href="/">查看前台</a><button id="logoutBtn" class="ghost">退出登录</button></aside><main><header><div><h1 id="pageTitle">仪表盘</h1><div id="status" class="muted"></div></div><button id="primaryAction" class="hidden">＋ 新增</button></header><section id="content"></section></main></div></template>
<dialog id="editor"><form method="dialog" class="modal" id="editorForm"><div class="modal-head"><h2 id="editorTitle"></h2><button value="cancel" class="ghost">✕</button></div><div id="editorBody"></div><p id="editorError" class="error"></p><div class="actions"><button value="cancel" class="ghost">取消</button><button id="saveBtn" value="default">保存</button></div></form></dialog>
<script type="module" src="/admin/admin.js"></script></body></html>
